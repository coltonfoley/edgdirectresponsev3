          - heading "Pergola Cost FAQs" [level=2] [ref=e544]
        - generic [ref=e545]:
          - generic [ref=e546]:
            - heading "Why do motorized pergolas cost so much more than basic pergolas from home improvement stores?" [level=3] [ref=e547]:
              - img [ref=e548]
              - text: Why do motorized pergolas cost so much more than basic pergolas from home improvement stores?
            - paragraph [ref=e551]: The difference is engineering, materials, and longevity. A $3,000 big-box pergola uses thin stamped aluminum with no wind or snow rating, generic motors, and no integrated drainage. It may last 5-7 years before showing significant wear. A premium motorized system uses aircraft-grade aluminum (6061-T6), is engineered for 100+ mph winds and heavy snow loads, includes internal gutter systems, and uses commercial-grade Somfy motors. These systems last 25+ years with minimal maintenance. You are not just buying shade—you are buying a permanent architectural improvement to your home.
