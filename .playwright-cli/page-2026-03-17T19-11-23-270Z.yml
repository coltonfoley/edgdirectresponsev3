              - img [ref=e554]
              - text: What is the cost per square foot for a motorized louvered pergola?
            - paragraph [ref=e557]: Premium motorized pergolas typically range from $120 to $200 per square foot installed, depending on features and site complexity. This compares to $15-30/sq ft for basic non-motorized aluminum pergolas and $40-80/sq ft for high-end wood structures. The per-square-foot cost decreases slightly as size increases due to economies of scale on engineering and installation mobilization.
          - generic [ref=e558]:
            - heading "Are there financing options available?" [level=3] [ref=e559]:
              - img [ref=e560]
              - text: Are there financing options available?
            - paragraph [ref=e563]: Yes, many homeowners finance pergola projects through home improvement loans, HELOCs, or specialized outdoor living financing. Some manufacturers offer promotional financing. For commercial projects, equipment financing and lease-to-own options are available. The key is treating this as a home improvement investment rather than a discretionary purchase.
          - generic [ref=e564]:
            - heading "How much should I budget for unexpected costs?" [level=3] [ref=e565]:
              - img [ref=e566]
              - text: How much should I budget for unexpected costs?
            - paragraph [ref=e569]: We recommend budgeting an additional 10-15% contingency for site preparation, electrical work, and permitting. If your property has challenging access, requires crane rental for installation, or needs significant deck reinforcement, costs can increase. During our site assessment, we identify these factors upfront so there are no surprises.
          - generic [ref=e570]:
            - heading "Do premium pergolas really add home value?" [level=3] [ref=e571]:
              - img [ref=e572]
              - text: Do premium pergolas really add home value?
            - paragraph [ref=e575]: Yes—when properly permitted and installed, permanent aluminum pergolas add appraised value similar to a high-end deck or sunroom. Unlike temporary structures or awnings that depreciate immediately, these are permanent improvements. Real estate agents in our markets (Chicago-Milwaukee corridor) report that homes with premium outdoor living spaces sell faster and for more money, particularly in the luxury segment.
          - generic [ref=e576]:
            - heading "What ongoing costs should I expect after installation?" [level=3] [ref=e577]:
              - img [ref=e578]
              - text: What ongoing costs should I expect after installation?
            - paragraph [ref=e581]: "Premium motorized pergolas are designed to be low-maintenance. Annual costs typically include: professional inspection and cleaning ($200-400/year, optional but recommended), occasional touch-up of powder coat if scratched, and eventual motor replacement after 10-15 years ($800-1,500 per motor). Compare this to wood pergolas requiring staining every 2-3 years ($1,000+) or cheap aluminum systems requiring full replacement after 5-7 years."
          - generic [ref=e582]:
            - heading "Why is installation such a significant portion of the cost?" [level=3] [ref=e583]:
              - img [ref=e584]
              - text: Why is installation such a significant portion of the cost?
            - paragraph [ref=e587]: "Proper installation requires specialized skills: precision leveling of structural posts, integration with home electrical systems, programming of smart controls, and calibration of safety sensors. We use certified installation crews—not general laborers—who understand the engineering requirements. Improper installation can void warranties, compromise structural integrity, and cause operational issues. This is not a DIY project or suitable for a general handyman."
          - generic [ref=e588]:
            - heading "How do I get an accurate quote for my specific project?" [level=3] [ref=e589]:
              - img [ref=e590]
              - text: How do I get an accurate quote for my specific project?
            - paragraph [ref=e593]: "Accurate quoting requires a site assessment. We need to evaluate: exact measurements and layout, soil conditions for footings, electrical access and capacity, wind exposure and snow loads for your area, and integration with existing structures. We provide fixed-price quotes after this assessment—not estimates that balloon later. Online calculators or per-square-foot pricing without site evaluation are unreliable for custom installations."
