            - paragraph [ref=e52]: Search "pergola cost" and you will see figures ranging from $500 for a DIY kit to $150,000+ for custom installations. This range creates confusion for homeowners trying to budget.
            - paragraph [ref=e53]: The gap exists because "pergola" describes vastly different products. A $3,000 big-box aluminum structure and a $60,000 motorized louvered system share a category name but little else in terms of engineering, materials, longevity, or performance.
            - paragraph [ref=e54]:
              - strong [ref=e55]: This guide explains what drives pricing for premium motorized systems
              - text: —the architectural-grade pergolas we specify and install that transform outdoor spaces into year-round living areas.
