name: CI

on:
  pull_request:
  push:
    branches:
      - edg-positioning

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check environment shape
        run: npm run env:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
